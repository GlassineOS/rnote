# Rnote Ink: GlassineOS's fork of Rnote (an unofficial fork, own name and app ID,
# installs beside upstream Rnote). Based on Flathub's manifest for Rnote
# (flathub/com.github.flxzt.rnote, 2026-05-01, Rnote 0.14.2), built from this tree
# by ../build-glassine.sh (network allowed, for the crates the fork adds).
app-id: org.glassine.RnoteInk
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.rust-stable
command: rnote
finish-args:
    - "--socket=wayland"
    - "--socket=fallback-x11"
    - "--device=dri"
    - "--share=ipc"
    - "--socket=pulseaudio"
    - "--filesystem=xdg-documents"
    - "--filesystem=xdg-pictures"
    - "--filesystem=xdg-desktop"
    - "--talk-name=org.gtk.vfs.*"
    - "--filesystem=xdg-run/gvfsd"
    - "--env=RUST_BACKTRACE=1"
    - "--env=RUST_LOG=rnote=warn,rnote-cli=warn,rnote-engine=warn,rnote-compose=warn"
    - "--env=GTK_PATH=/app/lib/gtk-4.0"
build-options:
    append-path: "/usr/lib/sdk/rust-stable/bin"
    build-args:
        - "--share=network"
modules:
    - name: rnote
      buildsystem: meson
      run-tests: false
      config-opts:
          - "-Dprofile=default"
          - "-Dcli=false"   # (the command-line tool: not needed, half the build time)
      sources:
          - type: dir
            path: ".."
            skip:
                - ".git"
                - "out"
